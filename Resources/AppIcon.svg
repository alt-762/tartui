<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Tartui app icon: "Tart Slices", Chocolate Neon palette with a violet apple slice.
       Source of Resources/AppIcon.icns; regenerate with scripts/make_icon.sh. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22202E"/>
      <stop offset="1" stop-color="#08080C"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="crust" gradientUnits="userSpaceOnUse" cx="470" cy="420" r="440">
      <stop offset="0" stop-color="#9A6440"/>
      <stop offset="0.6" stop-color="#6B3E26"/>
      <stop offset="1" stop-color="#3A1D0D"/>
    </radialGradient>
    <radialGradient id="rim" gradientUnits="userSpaceOnUse" cx="480" cy="440" r="330">
      <stop offset="0" stop-color="#9A6440"/>
      <stop offset="0.85" stop-color="#7E4A2E"/>
      <stop offset="1" stop-color="#6B3E26"/>
    </radialGradient>
    <radialGradient id="glaze" gradientUnits="userSpaceOnUse" cx="430" cy="400" r="330">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.38"/>
      <stop offset="0.55" stop-color="#FFFFFF" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="inset" gradientUnits="userSpaceOnUse" cx="512" cy="500" r="290">
      <stop offset="0.78" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.32"/>
    </radialGradient>
    <mask id="bite" maskUnits="userSpaceOnUse" x="-10" y="-10" width="130" height="140">
      <rect x="-10" y="-10" width="130" height="140" fill="#FFFFFF"/>
      <circle cx="98" cy="62" r="16" fill="#000000"/>
    </mask>
    <clipPath id="clip">
      <rect x="100" y="100" width="824" height="824" rx="185"/>
    </clipPath>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
    <filter id="blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="20"/>
    </filter>
    <filter id="ico" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000000" flood-opacity="0.32"/>
    </filter>
  </defs>

  <g filter="url(#sh)">
    <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
  </g>

  <g clip-path="url(#clip)">
    <!-- confetti -->
    <rect x="160" y="170" width="34" height="12" rx="6" fill="#FF00A8" transform="rotate(-30 177 176)"/>
    <rect x="820" y="180" width="34" height="12" rx="6" fill="#00E5FF" transform="rotate(40 837 186)"/>
    <rect x="150" y="850" width="34" height="12" rx="6" fill="#FFE600" transform="rotate(20 167 856)"/>
    <rect x="830" y="840" width="34" height="12" rx="6" fill="#B6FF00" transform="rotate(-50 847 846)"/>
    <circle cx="250" cy="140" r="7" fill="#FFE600"/>
    <circle cx="140" cy="300" r="6" fill="#00E5FF"/>
    <circle cx="890" cy="720" r="7" fill="#FF00A8"/>
    <circle cx="760" cy="895" r="6" fill="#B6FF00"/>

    <!-- tart shadow -->
    <circle cx="520" cy="552" r="350" fill="#000000" opacity="0.45" filter="url(#blur)"/>

    <!-- scalloped crust -->
    <g fill="url(#crust)">
      <circle cx="837" cy="512" r="40"/>
      <circle cx="821.1" cy="612.4" r="40"/>
      <circle cx="774.9" cy="703" r="40"/>
      <circle cx="703" cy="774.9" r="40"/>
      <circle cx="612.4" cy="821.1" r="40"/>
      <circle cx="512" cy="837" r="40"/>
      <circle cx="411.6" cy="821.1" r="40"/>
      <circle cx="321" cy="774.9" r="40"/>
      <circle cx="249.1" cy="703" r="40"/>
      <circle cx="202.9" cy="612.4" r="40"/>
      <circle cx="187" cy="512" r="40"/>
      <circle cx="202.9" cy="411.6" r="40"/>
      <circle cx="249.1" cy="321" r="40"/>
      <circle cx="321" cy="249.1" r="40"/>
      <circle cx="411.6" cy="202.9" r="40"/>
      <circle cx="512" cy="187" r="40"/>
      <circle cx="612.4" cy="202.9" r="40"/>
      <circle cx="703" cy="249.1" r="40"/>
      <circle cx="774.9" cy="321" r="40"/>
      <circle cx="821.1" cy="411.6" r="40"/>
      <circle cx="512" cy="512" r="325"/>
    </g>
    <g fill="#FFFFFF" opacity="0.35">
      <ellipse cx="321" cy="240" rx="16" ry="7" transform="rotate(-45 321 240)"/>
      <ellipse cx="410" cy="194" rx="16" ry="7" transform="rotate(-20 410 194)"/>
      <ellipse cx="510" cy="178" rx="16" ry="7"/>
      <ellipse cx="243" cy="314" rx="16" ry="7" transform="rotate(-60 243 314)"/>
    </g>
    <circle cx="512" cy="512" r="300" fill="url(#rim)"/>
    <circle cx="512" cy="512" r="284" fill="none" stroke="#000000" stroke-opacity="0.18" stroke-width="10"/>

    <!-- slices -->
    <path d="M512 512 L315.4 315.4 A278 278 0 0 1 708.6 315.4 Z" fill="#8F3BFF"/>
    <path d="M512 512 L708.6 315.4 A278 278 0 0 1 708.6 708.6 Z" fill="#00C8E0"/>
    <path d="M512 512 L708.6 708.6 A278 278 0 0 1 315.4 708.6 Z" fill="#B6FF00"/>
    <path d="M512 512 L315.4 708.6 A278 278 0 0 1 315.4 315.4 Z" fill="#FFE600"/>
    <circle cx="512" cy="512" r="278" fill="url(#inset)"/>
    <circle cx="512" cy="512" r="278" fill="url(#glaze)"/>
    <g stroke="#7E4A2E" stroke-width="16" stroke-linecap="round">
      <line x1="512" y1="512" x2="315.4" y2="315.4"/>
      <line x1="512" y1="512" x2="708.6" y2="315.4"/>
      <line x1="512" y1="512" x2="708.6" y2="708.6"/>
      <line x1="512" y1="512" x2="315.4" y2="708.6"/>
    </g>
    <g stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="4" stroke-linecap="round">
      <line x1="506" y1="506" x2="320" y2="320"/>
      <line x1="518" y1="506" x2="704" y2="320"/>
    </g>
    <circle cx="512" cy="512" r="32" fill="url(#rim)"/>
    <circle cx="512" cy="512" r="13" fill="#FFFFFF"/>
    <circle cx="508" cy="508" r="4" fill="#FFFFFF" opacity="0.9"/>

    <!-- apple (macOS) -->
    <g filter="url(#ico)">
      <g transform="translate(462 314)" mask="url(#bite)">
        <path d="M50 32 C40 26 22 24 12 36 C0 50 4 76 14 92 C22 106 32 116 42 114 C46 113 48 110 50 110 C52 110 54 113 58 114 C68 116 78 106 86 92 C96 76 100 50 88 36 C78 24 60 26 50 32 Z" fill="#FFFFFF"/>
        <path d="M52 26 C52 12 62 2 74 0 C74 14 64 24 52 26 Z" fill="#FFFFFF"/>
      </g>
    </g>

    <!-- penguin (Linux) -->
    <g filter="url(#ico)">
      <g transform="translate(587 448) scale(0.55)">
        <ellipse cx="62" cy="120" rx="12" ry="36" fill="#15132B" transform="rotate(15 62 120)"/>
        <ellipse cx="168" cy="120" rx="12" ry="36" fill="#15132B" transform="rotate(-15 168 120)"/>
        <rect x="60" y="30" width="110" height="160" rx="55" fill="#15132B"/>
        <ellipse cx="115" cy="130" rx="38" ry="50" fill="#FFFFFF"/>
        <circle cx="97" cy="70" r="11" fill="#FFFFFF"/>
        <circle cx="133" cy="70" r="11" fill="#FFFFFF"/>
        <circle cx="99" cy="72" r="5" fill="#15132B"/>
        <circle cx="131" cy="72" r="5" fill="#15132B"/>
        <path d="M103 88 Q115 82 127 88 Q115 104 103 88 Z" fill="#FFB703"/>
        <ellipse cx="92" cy="194" rx="22" ry="9" fill="#FFB703"/>
        <ellipse cx="138" cy="194" rx="22" ry="9" fill="#FFB703"/>
      </g>
    </g>

    <!-- secure & isolated -->
    <circle cx="512" cy="652" r="76" fill="none" stroke="#15132B" stroke-opacity="0.9" stroke-width="5" stroke-dasharray="10 12" stroke-linecap="round"/>
    <g filter="url(#ico)">
      <path d="M512 590 L562 608 L562 648 C562 680 540 702 512 714 C484 702 462 680 462 648 L462 608 Z" fill="#14121F"/>
      <path d="M512 598 L554 613 L554 620 L512 605 Z" fill="#FFFFFF" opacity="0.18"/>
      <path d="M498 646 L498 634 C498 625 504 619 512 619 C520 619 526 625 526 634 L526 646" fill="none" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round"/>
      <rect x="492" y="644" width="40" height="32" rx="7" fill="#FFFFFF"/>
      <circle cx="512" cy="657" r="5" fill="#14121F"/>
      <rect x="510" y="658" width="4" height="10" rx="2" fill="#14121F"/>
    </g>

    <!-- VM cube -->
    <g filter="url(#ico)">
      <polygon points="375,452 427,482 375,512 323,482" fill="#FFFFFF"/>
      <polygon points="323,482 375,512 375,572 323,542" fill="#FF00A8"/>
      <polygon points="375,512 427,482 427,542 375,572" fill="#00C8E0"/>
      <polygon points="375,452 427,482 427,542 375,572 323,542 323,482" fill="none" stroke="#15132B" stroke-opacity="0.25" stroke-width="3" stroke-linejoin="round"/>
    </g>

    <!-- highlights -->
    <ellipse cx="420" cy="300" rx="110" ry="36" fill="#FFFFFF" opacity="0.22" transform="rotate(-30 420 300)"/>
    <ellipse cx="340" cy="400" rx="26" ry="10" fill="#FFFFFF" opacity="0.2" transform="rotate(-60 340 400)"/>
    <rect x="100" y="100" width="824" height="400" fill="url(#gloss)"/>
  </g>
</svg>
