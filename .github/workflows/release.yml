name: Release

# Builds TartUI.app, packages it as a DMG and publishes it to a GitHub Release
# whenever a version tag (e.g. v0.2.0, v1.0.0-beta.1) is pushed.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)build a release for, e.g. v0.2.0"
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-15
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
      # Optional: Developer ID signing. If these are not set the app is ad-hoc signed.
      MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}                   # base64 of a Developer ID Application .p12
      MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}         # e.g. "Developer ID Application: Name (TEAMID)"
      # Optional: notarization (requires signing above).
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}                 # app-specific password
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: Show toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version

      - name: Work out version
        id: version
        run: |
          VERSION="${TAG#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [[ "$VERSION" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi
          echo "Releasing TartUI $VERSION from tag $TAG"

      - name: Stamp version into Info.plist
        run: |
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString ${{ steps.version.outputs.version }}" Resources/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${{ github.run_number }}" Resources/Info.plist

      - name: Run tests
        run: swift test

      - name: Build TartUI.app
        run: ./scripts/bundle.sh

      - name: Import signing certificate
        if: env.MACOS_CERTIFICATE != '' && env.MACOS_SIGNING_IDENTITY != ''
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          echo "$MACOS_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -P "$MACOS_CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/cert.p12"

      - name: Sign app with Developer ID
        if: env.MACOS_CERTIFICATE != '' && env.MACOS_SIGNING_IDENTITY != ''
        run: |
          codesign --force --options runtime --timestamp \
            --sign "$MACOS_SIGNING_IDENTITY" build/TartUI.app
          codesign --verify --deep --strict --verbose=2 build/TartUI.app

      - name: Create DMG
        run: |
          ./scripts/make_dmg.sh "${{ steps.version.outputs.version }}"
          if [ -n "$MACOS_CERTIFICATE" ] && [ -n "$MACOS_SIGNING_IDENTITY" ]; then
            codesign --force --timestamp --sign "$MACOS_SIGNING_IDENTITY" \
              "build/TartUI-${{ steps.version.outputs.version }}.dmg"
          fi

      - name: Notarize DMG
        if: env.MACOS_CERTIFICATE != '' && env.MACOS_SIGNING_IDENTITY != '' && env.APPLE_ID != '' && env.APPLE_APP_PASSWORD != '' && env.APPLE_TEAM_ID != ''
        run: |
          DMG="build/TartUI-${{ steps.version.outputs.version }}.dmg"
          xcrun notarytool submit "$DMG" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait
          xcrun stapler staple "$DMG"

      - name: Checksum
        run: |
          cd build
          shasum -a 256 "TartUI-${{ steps.version.outputs.version }}.dmg" > "TartUI-${{ steps.version.outputs.version }}.dmg.sha256"
          cat "TartUI-${{ steps.version.outputs.version }}.dmg.sha256"

      - name: Upload DMG as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: TartUI-${{ steps.version.outputs.version }}
          path: |
            build/TartUI-${{ steps.version.outputs.version }}.dmg
            build/TartUI-${{ steps.version.outputs.version }}.dmg.sha256

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
        run: |
          FILES=("build/TartUI-$VERSION.dmg" "build/TartUI-$VERSION.dmg.sha256")
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG exists, replacing assets"
            gh release upload "$TAG" "${FILES[@]}" --clobber
          else
            FLAGS=(--title "TartUI $VERSION" --generate-notes --verify-tag)
            if [ "$PRERELEASE" = "true" ]; then FLAGS+=(--prerelease); fi
            gh release create "$TAG" "${FILES[@]}" "${FLAGS[@]}"
          fi

      - name: Clean up keychain
        if: always()
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          if [ -f "$KEYCHAIN" ]; then security delete-keychain "$KEYCHAIN"; fi
